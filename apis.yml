name: Syenta
description: 'Syenta is an Australian deep-tech semiconductor company (founded 2022, spun out of the Australian
  National University, with teams across Australia, Europe and the United States) building manufacturing
  equipment for advanced chip packaging. Its proprietary Localized Electrochemical Manufacturing (LEM)
  technology combines material deposition and 3D patterning in a single step to produce sub-micron High-Resolution
  Interconnects on large (>1000 mm2) packages, targeting the chip-to-chip bandwidth bottleneck in AI
  computing; its Achyon production tool delivers wafer-level system integration at high density. Backed
  by Playground Global and Australia''s National Reconstruction Fund (Series A), Syenta is a hardware /
  fabrication-equipment maker and publishes no public developer API, SDK, or documentation surface.'
